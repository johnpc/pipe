name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SCHEME: pipe
  DESTINATION: "platform=iOS Simulator,name=iPhone 17 Pro"

jobs:
  build:
    name: Build
    # Self-hosted Mac Mini. This workflow runs on pull_request too, and
    # self-hosted runners on a public repo are unsafe for fork PRs (arbitrary
    # code execution) — so only run for push-to-main or a PR authored by the
    # repo owner. unit-tests/crap-analysis/acceptance-tests all `needs: build`
    # (directly or transitively) so skipping this job skips them too.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'johnpc'
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Enforce 300-line limit on all source files
        run: bash scripts/check_file_lines.sh

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -quiet

      - name: Cache DerivedData
        uses: actions/cache/save@v5
        with:
          path: DerivedData
          key: derived-data-${{ github.sha }}

  unit-tests:
    name: Unit Tests + Coverage
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: DerivedData
          key: derived-data-${{ github.sha }}

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:"pipeTests" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -quiet

      - name: Export coverage JSON
        run: xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - name: Enforce coverage >= 80%
        run: python3 scripts/coverage_check.py coverage.json

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.json

  crap-analysis:
    name: CRAP Score Analysis
    runs-on: [self-hosted, mac-mini-light]
    timeout-minutes: 10
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: coverage
      - name: Calculate CRAP scores (threshold 15)
        run: python3 scripts/crap_check.py coverage.json

  acceptance-tests:
    name: Acceptance
    runs-on: [self-hosted, mac-mini]
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: DerivedData
          key: derived-data-${{ github.sha }}
      - name: Verify generated acceptance tests match .feature files
        run: python3 scripts/generate_acceptance_tests.py --check
      - name: Start the fake Piped backend (for @fake-server scenarios)
        run: |
          # Loopback only; scenarios tagged @fake-server launch the app with
          # --uitest-instance http://127.0.0.1:8765 and play its synthetic media.
          # --daemon detaches in-process (nohup can't under the LaunchDaemon runner).
          rm -f /tmp/pipe-fake.log
          python3 -I scripts/fake_piped/server.py --port 8765 --daemon --log /tmp/pipe-fake.log --pidfile /tmp/pipe-fake.pid
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/healthz && break || sleep 0.5; done
          curl -fsS http://127.0.0.1:8765/healthz  # fail the step loudly if it never came up
      - name: Run all scenarios on parallel simulators
        run: |
          # One job on the one Mac Mini: matrix shards would just queue behind
          # each other. Instead Xcode clones the simulator and spreads the
          # per-feature test classes across workers. Each test runs exactly
          # once — there is no retry: a test that fails is a bug (in the app or
          # the test) and gets fixed, never re-rolled. Running the whole target
          # means no scenario can be skipped by a stale filter.
          rm -rf AcceptanceResults.xcresult
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:pipeUITests \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count 4 \
            -resultBundlePath AcceptanceResults.xcresult \
            -quiet
      - name: Stop the fake Piped backend
        if: always()
        run: |
          kill "$(cat /tmp/pipe-fake.pid)" 2>/dev/null || true
          tail -n 20 /tmp/pipe-fake.log || true
      - name: Summarize failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path AcceptanceResults.xcresult \
            | python3 -c "import json,sys; [print(f'❌ {f[\"testIdentifierString\"]}: {f[\"failureText\"]}') for f in json.load(sys.stdin).get('testFailures', [])]"
      - name: Keep the result bundle (screenshots at each failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: acceptance-results
          path: AcceptanceResults.xcresult
          retention-days: 7

  background-cpu:
    name: Background CPU budget
    # iOS kills a backgrounded app averaging >80% CPU for a minute, with no error
    # (2026-11-26: the feed's per-second re-render did it mid-listen). This plays
    # with a 600-video feed in the background and fails over 20% host CPU; see
    # scripts/perf/background_cpu.sh for the calibration.
    runs-on: [self-hosted, mac-mini]
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: DerivedData
          key: derived-data-${{ github.sha }}
      - name: Measure background CPU while playing
        run: bash scripts/perf/background_cpu.sh

  deploy:
    # Shared native iOS deploy (johnpc/ci-workflows): signs in the archive from the
    # Mac mini's CI keychain, uploads to TestFlight, and on a version conflict bumps
    # the minor version and lands it as a PR (opened with DEPLOY_PAT, so its CI runs).
    needs: [unit-tests, crap-analysis, acceptance-tests, background-cpu]
    # Also on a manual run (Actions → Run workflow on main): GitHub dropped a
    # push event on 2026-11-25 and the merge sat undeployed until a no-op commit.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: johnpc/ci-workflows/.github/workflows/ios-deploy-native.yml@v1
    secrets: inherit
    with:
      project: pipe.xcodeproj
      scheme: pipe
      bump: minor
      secret-env: PIPE_LOGS_API_KEY
      # Injected via pipe/Config.xcconfig's optional #include; without it the
      # release build ships an empty key and diagnostics upload silently no-ops.
      setup-command: printf 'PIPE_LOGS_API_KEY = %s\n' "$PIPE_LOGS_API_KEY" > pipe/Secrets.xcconfig
