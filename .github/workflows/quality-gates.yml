name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SCHEME: pipe
  DESTINATION: "platform=iOS Simulator,name=iPhone 17 Pro"

jobs:
  build:
    name: Build
    # Self-hosted Mac Mini. This workflow runs on pull_request too, and
    # self-hosted runners on a public repo are unsafe for fork PRs (arbitrary
    # code execution) — so only run for push-to-main or a PR authored by the
    # repo owner. unit-tests/crap-analysis/acceptance-tests all `needs: build`
    # (directly or transitively) so skipping this job skips them too.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'johnpc'
    runs-on: [self-hosted, mac-mini]
    steps:
      - uses: actions/checkout@v5

      - name: Enforce 100-line limit on all source files
        run: bash scripts/check_file_lines.sh

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -quiet

      - name: Cache DerivedData
        uses: actions/cache/save@v5
        with:
          path: DerivedData
          key: derived-data-${{ github.sha }}

  unit-tests:
    name: Unit Tests + Coverage
    runs-on: [self-hosted, mac-mini]
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: DerivedData
          key: derived-data-${{ github.sha }}

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:"pipeTests" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -quiet

      - name: Export coverage JSON
        run: xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - name: Enforce coverage >= 80%
        run: python3 scripts/coverage_check.py coverage.json

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.json

  crap-analysis:
    name: CRAP Score Analysis
    runs-on: [self-hosted, mac-mini]
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: coverage
      - name: Calculate CRAP scores (threshold 15)
        run: python3 scripts/crap_check.py coverage.json

  acceptance-tests:
    name: Acceptance
    runs-on: [self-hosted, mac-mini]
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: DerivedData
          key: derived-data-${{ github.sha }}
      - name: Verify generated acceptance tests match .feature files
        run: python3 scripts/generate_acceptance_tests.py --check
      - name: Run all scenarios on parallel simulators
        run: |
          # One job on the one Mac Mini: matrix shards would just queue behind
          # each other. Instead Xcode clones the simulator and spreads the
          # per-feature test classes across workers. Only a failing test is
          # retried (a flake that passes on retry passes; a real failure fails
          # every iteration and fails the job). Running the whole target means
          # no scenario can be skipped by a stale filter.
          rm -rf AcceptanceResults.xcresult
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:pipeUITests \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count 4 \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -resultBundlePath AcceptanceResults.xcresult \
            -quiet
      - name: Summarize failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path AcceptanceResults.xcresult \
            | python3 -c "import json,sys; [print(f'❌ {f[\"testIdentifierString\"]}: {f[\"failureText\"]}') for f in json.load(sys.stdin).get('testFailures', [])]"

  deploy:
    name: Deploy to App Store Connect
    runs-on: [self-hosted, mac-mini]
    needs: [unit-tests, crap-analysis, acceptance-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Write diagnostics API key
        run: |
          # Injected into the app via pipe/Config.xcconfig's optional #include of
          # Secrets.xcconfig (gitignored). Without this, the release build ships
          # an empty key and diagnostics upload silently no-ops.
          printf 'PIPE_LOGS_API_KEY = %s\n' "${{ secrets.PIPE_LOGS_API_KEY }}" > pipe/Secrets.xcconfig

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_CONTENT }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Revoke stale API-created certificates
        run: |
          python3 - << 'EOF'
          import json, os, time, urllib.request, ssl
          ctx = ssl.create_default_context()

          key_id = "${{ secrets.ASC_KEY_ID }}"
          issuer_id = "${{ secrets.ASC_ISSUER_ID }}"
          key_path = os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")

          # Inline minimal JWT (ES256) without PyJWT
          import subprocess, tempfile, base64
          def b64url(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          header = b64url(json.dumps({"alg":"ES256","kid":key_id,"typ":"JWT"}).encode())
          now = int(time.time())
          payload = b64url(json.dumps({"iss":issuer_id,"iat":now,"exp":now+1200,"aud":"appstoreconnect-v1"}).encode())
          signing_input = f"{header}.{payload}".encode()

          # Sign with openssl
          with tempfile.NamedTemporaryFile(suffix=".bin", delete=False) as tf:
              tf.write(signing_input)
              tf.flush()
              result = subprocess.run(
                  ["openssl", "dgst", "-sha256", "-sign", key_path, tf.name],
                  capture_output=True
              )
          # Convert DER signature to raw r||s (64 bytes)
          der = result.stdout
          def parse_der_int(data, offset):
              assert data[offset] == 0x02
              length = data[offset+1]
              value = data[offset+2:offset+2+length]
              while len(value) > 32 and value[0] == 0:
                  value = value[1:]
              value = b'\x00' * (32 - len(value)) + value
              return value, offset + 2 + length

          assert der[0] == 0x30
          r, offset = parse_der_int(der, 2)
          s, _ = parse_der_int(der, offset)
          raw_sig = b64url(r + s)

          token = f"{header}.{payload}.{raw_sig}"
          headers_dict = {"Authorization": f"Bearer {token}"}

          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/certificates", headers=headers_dict)
          resp = urllib.request.urlopen(req, context=ctx)
          certs = json.loads(resp.read()).get("data", [])

          api_certs = [c for c in certs if "Created via API" in c["attributes"].get("name", "")]
          if not api_certs:
              print("No stale API certificates to revoke.")
          else:
              print(f"Found {len(api_certs)} API-created certificates, revoking...")
              for cert in api_certs:
                  try:
                      dreq = urllib.request.Request(
                          f"https://api.appstoreconnect.apple.com/v1/certificates/{cert['id']}",
                          headers=headers_dict, method="DELETE"
                      )
                      urllib.request.urlopen(dreq, context=ctx)
                      print(f"  {cert['id']}: revoked")
                  except Exception as e:
                      print(f"  {cert['id']}: skip ({e})")
          EOF

      - name: Create temporary signing keychain
        run: |
          # The runner is a LaunchDaemon with no login session, so the login
          # keychain is locked and Xcode can't store the signing certificate it
          # creates ("Write permissions error"). Sign from a throwaway keychain
          # unlocked for this job only; the last step puts everything back.
          KC="$RUNNER_TEMP/signing.keychain-db"
          PW=$(uuidgen)
          security list-keychains -d user | tr -d '"' > "$RUNNER_TEMP/keychains.orig"
          security default-keychain -d user | tr -d ' "' > "$RUNNER_TEMP/default-keychain.orig"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security list-keychains -d user -s "$KC" $(cat "$RUNNER_TEMP/keychains.orig")
          security default-keychain -d user -s "$KC"

      - name: Increment build number
        run: |
          BUILD_NUM=$(date +%Y%m%d%H%M)
          agvtool new-version -all $BUILD_NUM

      - name: Archive and upload (auto-bump version on conflict)
        run: |
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${{ secrets.TEAM_ID }}</string>
          </dict>
          </plist>
          PLIST

          archive_and_upload() {
            xcodebuild archive \
              -scheme "$SCHEME" \
              -destination "generic/platform=iOS" \
              -archivePath ~/Desktop/pipe.xcarchive \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
              -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
              -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
              -quiet

            xcodebuild -exportArchive \
              -archivePath ~/Desktop/pipe.xcarchive \
              -exportOptionsPlist /tmp/ExportOptions.plist \
              -exportPath ~/Desktop/export \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
              -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
              -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} 2>&1
          }

          OUTPUT=$(archive_and_upload) && echo "$OUTPUT" && exit 0

          if echo "$OUTPUT" | grep -qi "version.*already exists\|already been uploaded\|redundant binary\|train.*closed\|higher version"; then
            echo "⚠️ Version conflict detected, bumping minor version..."
            CURRENT=$(grep 'MARKETING_VERSION' pipe.xcodeproj/project.pbxproj | head -1 | sed 's/.*= *\(.*\);/\1/')
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            NEW_VERSION="${MAJOR}.$((MINOR + 1))"
            sed -i '' "s/MARKETING_VERSION = ${CURRENT}/MARKETING_VERSION = ${NEW_VERSION}/g" pipe.xcodeproj/project.pbxproj
            echo "Bumped $CURRENT → $NEW_VERSION"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Bump version to $NEW_VERSION [skip ci]"
            git push

            rm -rf ~/Desktop/pipe.xcarchive ~/Desktop/export
            archive_and_upload
          else
            echo "$OUTPUT"
            exit 1
          fi

      - name: Restore keychains and remove signing material
        if: always()
        run: |
          # Self-hosted: nothing is wiped between jobs, so don't leave the ASC
          # key, the diagnostics key, or a signing keychain on the Mac Mini.
          if [ -f "$RUNNER_TEMP/default-keychain.orig" ]; then
            security default-keychain -d user -s "$(cat "$RUNNER_TEMP/default-keychain.orig")"
          fi
          if [ -f "$RUNNER_TEMP/keychains.orig" ]; then
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains.orig")
          fi
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 pipe/Secrets.xcconfig
          rm -rf ~/Desktop/pipe.xcarchive ~/Desktop/export
