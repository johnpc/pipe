AWSTemplateFormatVersion: "2010-09-09"
Description: >
  pipe demo backend: the fake Piped API's static export (labelled demo catalogue
  + synthetic media) served from a private S3 bucket through CloudFront. This is
  the instance a fresh install of the app points at, and what App Store review
  sees, so nothing here references a streaming service.
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: pipe demo backend (static fake Piped API + synthetic media)
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: s3
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # CachingOptimized: query strings are not part of the cache key and
          # not forwarded, so /search?q=anything serves the one `search` object.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          # S3 answers 403 for a missing key behind OAC; the app expects 404.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /healthz
            ErrorCachingMinTTL: 60
        ViewerCertificate: { CloudFrontDefaultCertificate: true }
Outputs:
  BucketName: { Value: !Ref Bucket }
  Domain: { Value: !GetAtt Distribution.DomainName }
  BaseURL: { Value: !Sub "https://${Distribution.DomainName}" }
